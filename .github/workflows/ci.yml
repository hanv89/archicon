name: ci

# Runs npm test on every PR + push to main so a broken state never lands.
# Pairs with release-skill.yml which runs npm test again before npm publish.
# Jobs grow as vendors / CLI adapters / skill features land (smoke, more
# bash-tests, sync-completeness, bundle-repro are added in later releases).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: scripts/smoke_cli.sh
        run: bash scripts/smoke_cli.sh
      - name: scripts/smoke_e2e.sh
        run: bash scripts/smoke_e2e.sh

  bash-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install librsvg2-bin (rsvg-convert) for build-script unit tests
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: scripts/_lib_icon_build.test.sh
        run: bash scripts/_lib_icon_build.test.sh
      - name: scripts/test_monitor_ms_tou.sh (fixture-based)
        run: bash scripts/test_monitor_ms_tou.sh
      - name: scripts/build_icon_index.test.sh
        run: bash scripts/build_icon_index.test.sh
      - name: scripts/build_azure.test.sh
        run: bash scripts/build_azure.test.sh
      - name: scripts/build_fabric.test.sh
        run: bash scripts/build_fabric.test.sh
      - name: scripts/build_kubernetes.test.sh
        run: bash scripts/build_kubernetes.test.sh
      - name: scripts/build_fluentui_system.test.sh
        run: bash scripts/build_fluentui_system.test.sh
      - name: scripts/build_devicon.test.sh
        run: bash scripts/build_devicon.test.sh
      - name: scripts/iac_to_diagram.test.sh
        run: bash scripts/iac_to_diagram.test.sh
      # >>> AWS-CI-BEGIN (verbatim-copy build unit test; no rsvg needed)
      - name: scripts/build_aws.test.sh
        run: bash scripts/build_aws.test.sh
      # <<< AWS-CI-END

  bundle-repro:
    # Assert the chat-UI distribution bundle builds byte-reproducibly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: scripts/test_chat_ui_bundle_repro.sh
        run: bash scripts/test_chat_ui_bundle_repro.sh

  contract:
    # Offline contract gates: the shipped dist/ + skill bundle must be
    # internally consistent. No network.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: scripts/validate_manifest.sh
        run: bash scripts/validate_manifest.sh
      - name: scripts/test_skill_refs.sh
        run: bash scripts/test_skill_refs.sh
      - name: scripts/test_index_integrity.sh
        run: bash scripts/test_index_integrity.sh
      - name: scripts/test_icon_sync_completeness.sh
        run: bash scripts/test_icon_sync_completeness.sh
      - name: scripts/lint_examples.sh
        run: bash scripts/lint_examples.sh
      # >>> AWS-CI-BEGIN (CC-BY-ND verbatim contract gate: build has no rsvg +
      #     shipped dist/AWS PNGs are sha256-identical to upstream; offline via
      #     the cached scripts/fixtures/aws-upstream-sha256.tsv)
      - name: scripts/test_aws_verbatim.sh
        run: bash scripts/test_aws_verbatim.sh
      # <<< AWS-CI-END

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Download actionlint v1.7.12 binary (pinned release URL)
        run: |
          set -euo pipefail
          mkdir -p /tmp/actionlint-dl
          cd /tmp/actionlint-dl
          curl -fsSL -O \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          curl -fsSL -O \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_checksums.txt
          grep 'linux_amd64\.tar\.gz$' actionlint_1.7.12_checksums.txt | sha256sum -c -
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          chmod +x actionlint
          mv actionlint /tmp/actionlint
          /tmp/actionlint -version
      - name: actionlint — lint all GitHub Actions workflow YAML
        run: /tmp/actionlint -color -shellcheck "shellcheck -S warning"

  fixture-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Fetch fixture/skill-md-only
        # Hard requirement — the fixture branch is a committed dependency; a
        # missing branch is a real failure, not a skip.
        run: git fetch origin fixture/skill-md-only:fixture/skill-md-only
      - name: scripts/test_fixture_drift.sh
        run: bash scripts/test_fixture_drift.sh
